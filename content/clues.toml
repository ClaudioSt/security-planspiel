# Hinweis-Matrix für die Spielleitung (VEIL-03, D-17, D-18).
# Je Angriff mindestens zwei Hinweise aus mindestens zwei Vorab-Dokumenten. `planspiel clues` prüft:
# source ist ein Schlüssel in texte.toml (story.* oder measures.*), quote steht dort wörtlich (nach NFC, mit
# Groß-/Kleinschreibung, mindestens 15 Zeichen, ohne typografische Anführungszeichen), why ist nicht leer.
# Diese Datei nennt die Angriffe und gehört nie in Material, das Spielende vor der Welle sehen.

# Angriff 1: Ransomware

[[clue]]
attack = "ransomware"
source = "story.steckbrief.it_ot_landschaft.saas_cloud.bullets"
quote = "Cloud-Backup: Veeam für Office-Daten (monatliche Sicherung)"
why = "Nur monatliche Sicherung, nur der Office-Daten: nach einem Verschlüsselungsangriff gäbe es kaum aktuelle Wiederherstellungspunkte."

[[clue]]
attack = "ransomware"
source = "story.anfrage_mail.lage.paragraphs"
quote = "Wir haben einen Virenscanner und Backups, aber keine strukturierte Security-Strategie."
why = "Nur klassischer Virenschutz und Backups: weder Erkennung auf den Endgeräten noch ein geübter Wiederanlauf."

[[clue]]
attack = "ransomware"
source = "story.zeitungsartikel.bericht_vorfall.ablauf.paragraphs"
quote = "Wir hatten kein funktionierendes Backup-Konzept"
why = "Der Artikel zeigt, was fehlende Wiederherstellung nach einem Erpresserangriff bedeutet."

[[clue]]
attack = "ransomware"
source = "story.zeitungsartikel.bericht_vorfall.headline"
quote = "Erpresser legen Zulieferer tagelang lahm"
why = "Erpressung mit Stillstand: das Muster des ersten Angriffs, ohne den Begriff zu nennen."

# Angriff 2: OT-Störung

[[clue]]
attack = "ot"
source = "story.steckbrief.it_ot_landschaft.ot_produktion.bullets"
quote = "Office-IT und OT/Produktion nutzen dasselbe LAN (kein separates OT-Netz)"
why = "Kein getrenntes Produktionsnetz: ein Vorfall im Büro erreicht die Fertigung."

[[clue]]
attack = "ot"
source = "story.steckbrief.betrieb_service.bullets"
quote = "Patch-/Update-Praxis in der Produktion: Umsetzung im Rahmen verfügbarer Wartungsfenster"
why = "Produktionssysteme werden nur in seltenen Wartungsfenstern gepatcht: bekannte Schwachstellen bleiben lange offen."

[[clue]]
attack = "ot"
source = "story.zeitungsartikel.meldung_audit.paragraphs"
quote = "bis zur sauberen Trennung von Büro- und Fertigungsnetzen"
why = "Der OEM verlangt die Netztrennung: ein Hinweis, dass die Produktion das Ziel ist."

[[clue]]
attack = "ot"
source = "story.zeitungsartikel.bericht_vorfall.folgen.paragraphs"
quote = "Drei Fertigungslinien standen still"
why = "Der Artikel zeigt einen Produktionsausfall als Folge."

[[clue]]
attack = "ot"
source = "story.audit_mail.nachweise.bullets"
quote = "OT-Segmentierung"
why = "Die Audit-Checkliste fragt direkt nach der Segmentierung der Produktionsnetze."

# Angriff 3: Datenexfiltration

[[clue]]
attack = "exfil"
source = "story.steckbrief.betrieb_service.bullets"
quote = "Remote-Zugänge durch fünf Lieferanten (u. a. MES, CAD, IT)"
why = "Mehrere externe Zugänge in sensible Systeme: Lieferanten sind ein möglicher Weg nach innen."

[[clue]]
attack = "exfil"
source = "story.steckbrief.it_ot_landschaft.saas_cloud.bullets"
quote = "Lieferanten-Portal: extern erreichbare Web-Applikation"
why = "Eine aus dem Internet erreichbare Anwendung mit Lieferantenzugang ist ein Einfallstor."

[[clue]]
attack = "exfil"
source = "story.anfrage_mail.lage.paragraphs"
quote = "wissen wir auch nicht genau, wer aktuell überall administrativen Zugriff auf unsere Systeme hat"
why = "Unklare, nicht kontrollierte Zugriffsrechte: wer Zugriff hat, kann Daten abziehen."

[[clue]]
attack = "exfil"
source = "story.zeitungsartikel.meldung_audit.paragraphs"
quote = "Supply Chain Security ist geschäftskritisch"
why = "Der OEM betont die Sicherheit der Lieferkette, der dritte Angriff läuft über sie."

[[clue]]
attack = "exfil"
source = "story.audit_mail.einleitung.paragraphs"
quote = "insb. Datenverlust, Supply-Chain-Angriffe"
why = "Der OEM nennt Angriffe über die Lieferkette ausdrücklich als Bedrohung."
