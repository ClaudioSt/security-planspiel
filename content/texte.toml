[sheets.ablauf.blocks.intro]
label = "Einführung"
direction = "Zeigt die Einführungsfolien und bildet die Teams."

[sheets.ablauf.blocks.break_1]
label = "Pause"
direction = "Pause. Legt währenddessen die Story-Unterlagen für jedes Team bereit."

[sheets.ablauf.blocks.story_groups]
label = "Story-Gruppenarbeit"
direction = "Gebt jedem Team die Story-Unterlagen (Unternehmenssteckbrief, Zeitungsartikel, Anfrage-Mail, Audit-Mail) und Teamheft (Schutzbedarf und Risikoregister). Die Teams lesen, sammeln Hinweise und füllen im Teamheft erst den Schutzbedarf je Wert, dann das Risikoregister aus. Fragt ein Team je Wert und Schutzziel, was ein Schaden fürs Geschäft bedeuten würde, antwortet mit der Tabelle „Geschäftsfolgen: Antworten der Geschäftsführung“."

[sheets.ablauf.blocks.measures_budget]
label = "Maßnahmen und Budget"
direction = "Gebt gemeinsam aus: Maßnahmenkarten, Übungsblatt, So funktioniert eine Welle und Teamheft (Budget und Planung, Tracking-Bogen). Das Übungsblatt ist eine Hilfe zum Nachschlagen; die Teams rechnen es nicht gemeinsam durch. Jedes Team einigt sich intern auf sein Budget-Tier und trägt seine Maßnahmen im Teamheft ein. Weist auf die freiwillige Spalte gegen R# im Teamheft hin; ihr prüft sie nicht. Danach füllen die Teams im Tracking-Bogen die Spalte Start aus: KZ-Start ihres Tiers, Init-Kosten und Restbudget (Tier-Budget minus Init-Kosten)."

[sheets.ablauf.blocks.break_2]
label = "Pause"
direction = "Pause. Haltet die Arbeitsblätter der Angriffe zurück: Kein Team sieht ein Arbeitsblatt vor Beginn der jeweiligen Welle."

[sheets.ablauf.blocks.wave_1]
direction = "Lest die Events dieser Welle vor und gebt die zugehörigen Eventkarten aus. Gebt erst jetzt das Arbeitsblatt dieser Welle aus, nie früher. Die Teams rechnen. Danach folgt innerhalb dieses Blocks das Change-Fenster mit dem Maßnahmentausch des Kurswechsels."

[sheets.ablauf.blocks.wave_2]
direction = "Lest die Events dieser Welle vor und gebt die zugehörigen Eventkarten aus. Gebt erst jetzt das Arbeitsblatt dieser Welle aus, nie früher. Die Teams rechnen. Danach folgt innerhalb dieses Blocks das Change-Fenster."

[sheets.ablauf.blocks.wave_3]
direction = "Lest die Events dieser Welle vor und gebt die zugehörigen Eventkarten aus. Gebt erst jetzt das Arbeitsblatt dieser Welle aus, nie früher. Die Teams rechnen. Danach folgt kein Change-Fenster mehr."

[sheets.ablauf.blocks.closing]
label = "Abschluss"
direction = "Gebt die Eventkarte „Budget Review“ und Teamheft (Return on Security, Budget Review) aus. Die Teams rechnen im Teamheft erst die RoS-Seite, dann das Budget Review aus, füllen im Risikoregister die Spalte Rückblick aus und berechnen zuletzt im Tracking-Bogen die KZ final. Notiert je Team KZ final und RoS in der Vergleichstabelle im Debriefing-Teil dieses Hefts; die Blätter bleiben bei den Teams."

[sheets.ablauf.blocks.debrief]
label = "Debriefing"
direction = "Besprecht den Verlauf anhand der Fragen im Debriefing-Teil dieses Hefts. Wenn Zeit bleibt, folgt der Management-Pitch der Teams."

