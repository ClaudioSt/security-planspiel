[story.zeitungsartikel.meldung_audit]
headline = "OEM VERSCHÄRFT SECURITY-ANFORDERUNGEN"
paragraphs = [
    "Stuttgart. Ein führender deutscher Automobilhersteller kündigte an, alle Tier-1- und Tier-2-Zulieferer ab dem kommenden Quartal einem IT-Security-Audit zu unterziehen.",
    "Erwartet werden belastbare Nachweise, dass Zulieferer nicht nur reagieren, sondern strukturiert vorsorgen: von der Fähigkeit, nach einem Vorfall schnell wieder anlaufen zu können, bis zur sauberen Trennung von Büro- und Fertigungsnetzen.",
    "„Supply Chain Security ist geschäftskritisch“, so ein Sprecher. Bei gravierenden Lücken behalte man sich vor, Aufträge zurückzustellen.",
]
caption = "Symbolbild: Verschärfte Audits für Zulieferer."

[story.zeitungsartikel.bericht_vorfall]
headline = "Erpresser legen Zulieferer tagelang lahm"
dateline = "Kassel"
lead = "Ein mittelständischer Automotive-Zulieferer aus Nordhessen wurde Opfer eines schweren Cyberangriffs. Die Produktion stand für 72 Stunden still, der Schaden wird auf über 500.000 Euro geschätzt."
caption = "Symbolbild: Stillstand in der Fertigung nach Cyberangriff."

[story.zeitungsartikel.bericht_vorfall.ablauf]
heading = "DER ANGRIFF"
paragraphs = [
    "Laut Informationen des Unternehmens erfolgte der Einbruch über eine gefälschte E-Mail, die ein Mitarbeiter in der Buchhaltung öffnete. Der klassische Virenschutz des Unternehmens schlug nicht rechtzeitig Alarm. Die Erpresser-Software sperrte innerhalb von zwei Stunden nicht nur Office-Daten, sondern auch das produktionssteuernde MES-System. Erst nach Stunden bemerkte die IT ungewöhnliche Aktivitäten im Netz. Zentrale Systeme waren zudem seit Monaten nicht mehr aktualisiert worden.",
    "„Wir hatten kein funktionierendes Backup-Konzept“, so der Geschäftsführer, der anonym bleiben möchte. Die Angreifer forderten 250.000 Euro in Bitcoin.",
]

[story.zeitungsartikel.bericht_vorfall.folgen]
heading = "FOLGEN"
paragraphs = [
    "Das Unternehmen entschied sich gegen die Zahlung und setzte die Systeme mit Unterstützung externer Forensiker neu auf. Drei Fertigungslinien standen still, Liefertermine konnten nicht eingehalten werden. Ein OEM-Kunde verhängte Vertragsstrafen wegen Lieferverzugs.",
    "„Auch kleine Zulieferer sind Ziele“, warnt Dr. Sabine Müller vom BSI. „Angreifer wissen: Produktionsausfälle erzeugen Zahlungsbereitschaft.“",
]

[story.anfrage_mail]
doc_title = "Anfrage: IT-Security-Beratung für MechTech GmbH"

[story.anfrage_mail.kopf]
von = "\"Dr. Thomas Weber\" <t.weber@mechtech-gmbh.de>"
an = "\"MHP Cyber Security\" <cyber-security@mhp.com>"

[story.anfrage_mail.anrede]
text = "Sehr geehrte Damen und Herren,"

[story.anfrage_mail.einleitung]
paragraphs = ["ich wende mich an Sie im Namen der MechTech GmbH. Wir sind ein mittelständischer Zulieferer für die Automotive-Industrie und produzieren Präzisionsteile für E-Antriebe."]

[story.anfrage_mail.lage]
paragraphs = [
    "Täglich lesen wir von Cyberangriffen auf Unternehmen unserer Größe und Branche.",
    "Ehrlich gesagt sind wir mit dem Thema IT-Sicherheit bisher eher reaktiv umgegangen. Wir haben einen Virenscanner und Backups, aber keine strukturierte Security-Strategie. Offen gestanden wissen wir auch nicht genau, wer aktuell überall administrativen Zugriff auf unsere Systeme hat.",
    "Wir möchten das ändern, wissen aber nicht, wo wir anfangen sollen.",
]

[story.anfrage_mail.aufgabe]
heading = "UNSER ANLIEGEN:"
text = "Können Sie uns dabei unterstützen, ein sinnvolles Security-Konzept zu entwickeln? Wir hätten Budget für ein Beratungsprojekt und möchten verstehen:"
bullets = [
    "Wo sind unsere größten Risiken?",
    "Welche Maßnahmen sind sinnvoll und umsetzbar?",
]

[story.anfrage_mail.abschluss]
paragraphs = ["Könnten Sie sich zunächst ein Bild von unserer Situation machen? Ich stehe für ein Erstgespräch gerne zur Verfügung."]

[story.anfrage_mail.gruss]
lines = [
    "Mit freundlichen Grüßen",
    "Dr. Thomas Weber",
    "Geschäftsführer",
    "MechTech GmbH",
]

[story.anfrage_mail.fusszeile]
lines = ["www.mechtech-gmbh.de | Industriestr. 42, 73033 Göppingen"]

