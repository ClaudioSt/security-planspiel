[sheets.was_neu.rules.levelwechsel]
heading = "Levelwechsel und Maßnahmentausch"
text = "Levelwechsel: dieselbe Maßnahme, anderes Level (auch Kündigen). Maßnahmentausch: eine Maßnahme raus, eine andere rein; ersetzt den alten Begriff der MHP-Runde."

[sheets.was_neu.rules.kurswechsel]
heading = "Kurswechsel"
text = "Das Event erlaubt im Change-Fenster danach genau einen Pflicht-Maßnahmentausch (eine aktive Maßnahme raus, eine inaktive rein); der Kunde trägt deren Init bis zur Höhe der weggefallenen."

[sheets.was_neu.rules.downgrade]
heading = "Herabstufen"
text = "Im Change-Fenster dürfen Teams Level senken oder Maßnahmen kündigen. Init wird nie erstattet, die OPEX sinken ab der nächsten Welle."

[sheets.was_neu.rules.init_window]
heading = "Init bei Hochstufung"
text = "Wer im Change-Fenster ein Level erhöht oder eine Maßnahme hinzufügt, zahlt die Init-Differenz netto und sofort; Wirkung und OPEX gelten ab der nächsten Welle."

[sheets.was_neu.rules.overspend]
heading = "Überziehung"
text = "Statt pauschal kostet das Überziehen am Ende"

[sheets.was_neu.rules.sparprogramm]
heading = "Sparprogramm"
text = "Rutscht ein Team durch das Sparprogramm ins Minus, zählt erst der Stand am Ende; im Change-Fenster danach kann es durch Herabstufen oder Kündigen zurück ins Budget."

[sheets.was_neu.rules.ros]
heading = "RoS ohne Event-Effekte"
text = "In die RoS gehen nur die eigenen Kosten ein (Init, OPEX, Init-Differenzen). Budget- und OPEX-Effekte von Events zählen weder als Abzug noch als Rabatt."

[sheets.was_neu.rules.review_boundary]
