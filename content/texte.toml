text = "Levelwechsel: dieselbe Maßnahme, anderes Level (auch Kündigen). Maßnahmentausch: eine Maßnahme raus, eine andere rein; ersetzt den alten Begriff der MHP-Runde."

[sheets.was_neu.rules.kurswechsel]
heading = "Kurswechsel"
text = "Das Event verlangt im Change-Fenster danach genau einen Maßnahmentausch (aktive Maßnahme raus, inaktive rein); der Kunde trägt die Init der neuen Maßnahme bis zur Init der alten."

[sheets.was_neu.rules.downgrade]
heading = "Senken, Kündigen"
text = "Im Change-Fenster dürfen Teams Level senken oder Maßnahmen kündigen. Init wird nie erstattet, die OPEX sinken ab der nächsten Welle."

[sheets.was_neu.rules.init_window]
heading = "Init beim Erhöhen"
text = "Wer im Change-Fenster ein Level erhöht oder eine Maßnahme hinzufügt, zahlt die Init-Differenz netto und sofort; Wirkung und OPEX gelten ab der nächsten Welle."

