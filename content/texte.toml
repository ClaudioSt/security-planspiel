legend_title = "Schaden fürs Geschäft"
title = "Risikoregister"
instruction = "Leitet daraus eure wichtigsten Risiken ab: Welcher Wert (W#) ist bedroht, wodurch, und in welchem Dokument steht der Hinweis? Welches Schutzziel wäre vor allem verletzt (Hauptziel), und welche Folge hätte das fürs Geschäft? Die Stufe tragt ihr nicht ein, sie steht oben in der Schutzbedarfstabelle (Zeile des Werts, Spalte des Hauptziels). Entscheidet, ob ihr es behandelt oder akzeptiert."
