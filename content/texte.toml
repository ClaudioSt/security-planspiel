    "Cloud-Nutzung ist auf Vertriebsprozesse (Salesforce) und die monatliche Datensicherung beschränkt, keine weiteren Fachanwendungen in der Cloud im Einsatz",
    "Mobilgeräte: Außendienst und Vertrieb nutzen firmeneigene Notebooks, kein separates Mobile-Device-Programm im Einsatz",
