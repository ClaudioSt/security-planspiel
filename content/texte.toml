# Inhaltsquelle des Planspiels: alle deutschen Texte für Druckmaterial (PRINT-02).
#
# Regeln:
# - Schlüssel entsprechen Config-IDs (measures, attacks, events, final_events); sheets und story
#   folgen den in planspiel/texts.py deklarierten Listen.
# - Keine Spielzahlen in der Prosa und keine {param}-Platzhalter: Zahlen erzeugt der Code aus der Config.
#   Ausnahmen stehen geprüft in digit_allowlist.toml; der Abschnitt story ist von der Ziffernprüfung ausgenommen.
# - Prüfen mit: uv run planspiel texts
# - Datei ist UTF-8 mit LF-Zeilenenden; Texte stehen in einfachen Zeichenketten ohne Zeilenumbruch.

[measures.M1]
focus = "Zugriffskontrolle, privilegierte Accounts"
description = "Wer darf was im Unternehmen? Diese Maßnahme stellt sicher, dass nur berechtigte Personen Zugang zu sensiblen Systemen haben – wie ein digitaler Türsteher."

[measures.M1.levels_desc]
1 = "Zentrales AD, MFA für Admins, Passwortrichtlinie"
2 = "PAM (Privileged Access Management), Rollenkonzept"
3 = "JIT-Access, Session-Recording, Access-Reviews"

[measures.M1.levels_simple]
1 = "Zentrale Benutzerverwaltung, Admins brauchen zwei Faktoren zum Einloggen."
2 = "Spezielle Verwaltung für Admin-Konten, klare Rollen, wer was darf."
3 = "Zugriff nur bei Bedarf, alle Admin-Aktionen werden aufgezeichnet."

[measures.M2]
focus = "Sichtbarkeit schaffen, Angriffe erkennen"
description = "Wie ein Überwachungssystem für die IT: Alle wichtigen Ereignisse werden protokolliert und ausgewertet, um verdächtige Aktivitäten frühzeitig zu erkennen."

[measures.M2.levels_desc]
1 = "Windows Event Logs zentral sammeln, 30 Tage"
2 = "SIEM mit Use Cases (Failed Logins, Priv. Escalation)"
3 = "MDR (Managed Detection & Response) mit 24/7-SOC"

[measures.M2.levels_simple]
1 = "Protokolle werden gesammelt und 30 Tage aufbewahrt."
2 = "Automatische Alarme bei verdächtigen Mustern (z. B. viele fehlgeschlagene Logins)."
3 = "Externe Sicherheitsexperten überwachen rund um die Uhr."

[measures.M3]
focus = "Schadsoftware auf Clients/Servern erkennen"
description = "Der Virenschutz für alle Computer im Unternehmen. Erkennt und stoppt Schadsoftware, bevor sie Schaden anrichten kann."

[measures.M3.levels_desc]
1 = "Aktueller Virenscanner, automatische Updates"
2 = "EDR mit Behavioral Analysis, Auto-Isolation"
3 = "XDR (Korrelation Endpoints, Netzwerk, Cloud)"

[measures.M3.levels_simple]
1 = "Klassischer Virenscanner, der bekannte Schadsoftware erkennt."
2 = "Erkennt auch unbekannte Bedrohungen anhand von verdächtigem Verhalten, isoliert befallene Rechner automatisch."
3 = "Vernetzt alle Sicherheitssysteme – erkennt komplexe Angriffe über mehrere Systeme hinweg."

[measures.M4]
focus = "Daten wiederherstellen, Betrieb aufrechterhalten"
description = "Die Lebensversicherung für Unternehmensdaten. Regelmäßige Sicherungskopien ermöglichen es, nach einem Angriff oder Ausfall schnell wieder arbeitsfähig zu sein."

[measures.M4.levels_desc]
1 = "Tägliche Backups Office-IT, 14 Tage, kein Test"
2 = "3-2-1-Regel, monatliche Restore-Tests"
3 = "Immutable Backups (Air-Gap), DR-Plan, RTO <4h"

[measures.M4.levels_simple]
1 = "Tägliche Datensicherung, aber ohne regelmäßige Tests, ob die Wiederherstellung funktioniert."
2 = "Backups an mehreren Orten, monatlich wird geprüft, ob die Wiederherstellung klappt."
3 = "Backups sind unveränderbar und vom Netzwerk getrennt – selbst Hacker können sie nicht löschen. Schnelle Wiederherstellung garantiert."

[measures.M5]
focus = "Produktionsnetz vom Office-Netz trennen"
description = "Baut digitale Brandmauern zwischen Büro und Produktion. Ein Angriff im Büro soll nicht die Fertigungsanlagen lahmlegen können."

[measures.M5.levels_desc]
1 = "Logische VLANs, keine Firewall-Regeln"
2 = "Firewall zwischen OT/IT, Whitelist-Prinzip"
3 = "IDS/IPS in OT, Micro-Segmentierung (Zonen/Linie)"

[measures.M5.levels_simple]
1 = "Netzwerke sind logisch getrennt, aber ohne strenge Zugangskontrollen."
2 = "Echte Firewall zwischen Büro und Produktion – nur explizit erlaubter Datenverkehr kommt durch."
3 = "Jede Produktionslinie ist einzeln abgesichert, verdächtiger Datenverkehr wird automatisch blockiert."

[measures.M6]
focus = "Mitarbeitende sensibilisieren, Phishing abwehren"
description = "Macht Mitarbeitende zur ersten Verteidigungslinie. Geschulte Mitarbeitende erkennen Betrugsversuche und gefährliche E-Mails, bevor Schaden entsteht."

[measures.M6.levels_desc]
1 = "Jährliche Pflichtschulung (E-Learning, 30 Min)"
2 = "Quartalsweise Schulungen + Phishing-Simulationen"
3 = "Rollenspez. Training, Incident-Meldeprozess etabliert"

[measures.M6.levels_simple]
1 = "Einmal im Jahr eine kurze Online-Schulung zum Thema IT-Sicherheit."
2 = "Regelmäßige Schulungen plus Test-Phishing-Mails, um die Wachsamkeit zu prüfen."
3 = "Spezielle Trainings je nach Rolle, klarer Prozess zum Melden von Verdachtsfällen."

[measures.M7]
focus = "Schwachstellen schließen, Angriffsfläche reduzieren"
description = "Hält alle Systeme auf dem neuesten Stand. Sicherheitslücken werden durch Updates geschlossen, bevor Angreifer sie ausnutzen können."

[measures.M7.levels_desc]
1 = "Automatische Windows-Updates, sporadisch OT-Patches"
2 = "Monatliche Patch-Zyklen, Vulnerability-Scans (quartalsweise)"
3 = "Risk-based Patching (CVSS), wöchentliche Scans mit Tool-Unterstützung"

[measures.M7.levels_simple]
1 = "Windows-Updates laufen automatisch, Produktionssysteme werden unregelmäßig aktualisiert."
2 = "Strukturierter monatlicher Update-Prozess, regelmäßige Suche nach Schwachstellen."
3 = "Kritische Lücken werden priorisiert geschlossen, wöchentliche automatische Schwachstellen-Scans."

[measures.M8]
focus = "Lieferanten-Risiken managen, Abhängigkeiten absichern"
description = "Schützt vor Risiken durch Geschäftspartner. Denn auch über einen gehackten Lieferanten können Angreifer ins Unternehmen gelangen."

[measures.M8.levels_desc]
1 = "Vertragliche Security-Klauseln, Ad-hoc-Checks"
2 = "Supplier-Assessments (jährlich), SLA-Monitoring"
3 = "Continuous Monitoring, Dual-Sourcing, Escrow-Verträge"

[measures.M8.levels_simple]
1 = "Sicherheitsanforderungen stehen im Vertrag, gelegentliche Überprüfungen."
2 = "Jährliche Sicherheitsbewertung aller wichtigen Lieferanten, Überwachung der Leistungsversprechen."
3 = "Kontinuierliche Überwachung, Ersatzlieferanten für kritische Teile, Schutz bei Lieferanten-Insolvenz."

[measures.M9]
focus = "Cloud-Konfigurationen überwachen & absichern"
description = "Sichert Daten und Dienste in der Cloud ab. Prüft automatisch, ob Cloud-Systeme sicher konfiguriert sind."

[measures.M9.levels_desc]
1 = "Basis-Monitoring Cloud-Backup (Veeam)"
2 = "CSPM-Tool (z. B. Prisma Cloud), Compliance-Checks"
3 = "Multi-Cloud-Security, IaC-Scanning, CNAPP"

[measures.M9.levels_simple]
1 = "Einfache Überwachung der Cloud-Backups."
2 = "Automatische Prüfung, ob die Cloud-Einstellungen den Sicherheitsrichtlinien entsprechen."
3 = "Umfassende Sicherheit über mehrere Cloud-Anbieter, automatische Prüfung aller Cloud-Konfigurationen."

[measures.M10]
focus = "Smartphones/Tablets absichern"
description = "Schützt mobile Geräte der Mitarbeitenden. Verhindert Datenverlust bei Diebstahl und kontrolliert, welche Apps genutzt werden dürfen."

[measures.M10.levels_desc]
1 = "PIN-Pflicht, Remote-Wipe bei Verlust"
2 = "MDM-Plattform (Intune/Jamf), App-Whitelisting"
3 = "UEM (Unified Endpoint Mgmt.), MTD (Mobile Threat Def.)"

[measures.M10.levels_simple]
1 = "PIN-Schutz ist Pflicht, bei Verlust kann das Gerät aus der Ferne gelöscht werden."
2 = "Zentrale Verwaltung aller Mobilgeräte, nur zugelassene Apps können installiert werden."
3 = "Einheitliche Verwaltung aller Endgeräte, aktiver Schutz vor mobilen Bedrohungen."

[attacks.ransomware.veiled]
title = "Angriff"

[attacks.ransomware.revealed]
name = "Ransomware"
narrative = "Ein Mitarbeitender von MechTech hat auf einen Link in einer gefälschten E-Mail geklickt. Die Angreifer versuchen, Ransomware zu platzieren, die Daten verschlüsselt und möglicherweise abzieht, um anschließend Lösegeld zu erpressen. Ob die Verschlüsselung tatsächlich gelingt und wie stark die Auswirkungen sind, ermittelt ihr jetzt anhand eurer Sicherheitsmaßnahmen."
cia_rationale = "Bei Ransomware zählen Vertraulichkeit (C) und Integrität (I) am stärksten (Datendiebstahl und Verschlüsselung); der Ausfall der Verfügbarkeit (A) ist meist die Folge daraus."
case_1 = "Eure Maßnahmen reichen nicht aus, der Angriff setzt sich durch."
case_2 = "Ihr wehrt den Angriff vollständig ab."
case_3 = "Ihr mindert die Auswirkungen teilweise."

[attacks.ransomware.revealed.bonus_reasons]
M3 = "EDR/XDR erkennt Ransomware früh"
M4 = "Backup ermöglicht schnelle Wiederherstellung"
M6 = "Geschulte Mitarbeitende erkennen Phishing"

[attacks.ot.veiled]
title = "Angriff"

[attacks.ot.revealed]
name = "OT-Störung"
narrative = "In der Produktionssteuerung von MechTech wurde eine Schwachstelle ausgenutzt. Die Angreifer zielen darauf ab, die Fertigung zu stören oder stillzulegen. Ob die Produktion wirklich ausfällt und wie stark die Auswirkungen sind, ermittelt ihr jetzt anhand eurer Sicherheitsmaßnahmen."
cia_rationale = "Bei OT-Störungen ist Verfügbarkeit (A) entscheidend, weil ein Stillstand direkt zu Produktionsausfall und Lieferverzug führt; C und I zählen hier weniger."
case_1 = "Eure Maßnahmen reichen nicht aus, die Produktion fällt aus."
case_2 = "Ihr verhindert den Ausfall vollständig."
case_3 = "Ihr mindert die Auswirkungen teilweise."

[attacks.ot.revealed.bonus_reasons]
M5 = "OT/IT-Segmentierung isoliert die Produktion"
M7 = "Patch Management schließt OT-Schwachstellen"

[attacks.exfil.veiled]
title = "Angriff"

[attacks.exfil.revealed]
name = "Datenexfiltration"
narrative = "Über einen kompromittierten Lieferanten-Zugang versuchen Angreifer seit Wochen, vertrauliche Konstruktionsdaten abzugreifen. Das Bundesamt für Sicherheit in der Informationstechnik (BSI) warnt: Im Darknet werden angeblich Daten von MechTech angeboten. Ob und wie viel tatsächlich abgeflossen ist und welche Folgen daraus entstehen, ermittelt ihr jetzt anhand eurer Sicherheitsmaßnahmen."
cia_rationale = "Bei Datenexfiltration zählt Vertraulichkeit (C) am meisten (Diebstahl von Know-how). Integrität (I) zählt mit, weil Daten kopiert und weiterverarbeitet werden; die Verfügbarkeit (A) bleibt meist erhalten."
case_1 = "Eure Maßnahmen reichen nicht aus, der Datenabfluss gelingt."
case_2 = "Ihr verhindert die Exfiltration vollständig."
case_3 = "Ihr mindert die Auswirkungen teilweise."

[attacks.exfil.revealed.bonus_reasons]
M1 = "IAM/PAM verhindert unbefugten Zugriff"
M2 = "SIEM erkennt Datenabfluss"
M8 = "Supplier Security schützt die Schnittstellen zu Lieferanten"

[events.kurswechsel]
narrative = "Nach den neuesten Erkenntnissen richtet die Geschäftsführung die Sicherheitsstrategie neu aus. Ihr müsst eine Maßnahme austauschen; der Kunde beteiligt sich an den Kosten."
rule = "Im Change-Fenster nach dieser Welle führt ihr genau einen Maßnahmentausch durch: Eine in dieser Welle aktive Maßnahme fällt ganz weg, eine in dieser Welle nicht aktive kommt auf einem Level eurer Wahl hinzu. Der Kunde übernimmt die Init-Kosten der neuen Maßnahme bis zur Höhe der Init-Kosten der wegfallenden (auf ihrem Level in dieser Welle). Einen Mehrbetrag zahlt ihr; ist die neue Maßnahme günstiger, gibt es keine Erstattung. Braucht eine andere Maßnahme die wegfallende als Voraussetzung, senkt ihr sie im selben Fenster auf ein Level ohne diese Voraussetzung. Ist in dieser Welle keine oder jede Maßnahme aktiv, entfällt der Tausch. Weitere Änderungen im selben Fenster bleiben erlaubt."

[events.operative_unterstuetzung]
narrative = "Ihr bekommt operative Unterstützung: Ein zentraler Rahmenvertrag senkt in dieser Welle die laufenden Betriebskosten eurer Security-Maßnahmen, ohne dass ihr an Leistung verliert."
rule = "Zählt für jede Maßnahme, die in dieser Welle aktiv ist."

[events.sparprogramm]
narrative = "Der CFO verkündet ein unternehmensweites Sparprogramm, und auch eure Security-Initiativen bleiben nicht verschont. Das Budget wird gekürzt."
rule = "Geprüft wird das Restbudget erst am Ende; im Change-Fenster nach dieser Welle könnt ihr noch gegensteuern (Senken oder Kündigen spart OPEX in der nächsten Welle, Init wird nicht erstattet)."

[events.oem_audit]
narrative = "Der große Automobilkunde prüft die Sicherheitsstandards. Im Audit zählt nicht, ob ihr „Best-in-Class“ seid, sondern ob ihr die grundlegenden Kontrollen überhaupt verlässlich umgesetzt habt."
checklist_heading = "Audit-Checkliste"

[events.kritische_schwachstelle]
narrative = "Ein Softwarehersteller informiert MechTech: In einem dort genutzten System wurde eine kritische Schwachstelle entdeckt, die aktiv ausgenutzt werden könnte."

[events.kritische_schwachstelle.tier_labels]
0 = "Patch verzögert/chaotisch"
1 = "Patch gelingt, aber mit Reibung"
2 = "Patch planbar und zügig"
3 = "Patch routiniert, mit Nachweis/Reporting"

[events.exzellenz_bonus]
narrative = "Maßnahmen, die nachweislich „enterprise-ready“ umgesetzt sind, erhöhen das Vertrauen. Für jede Maßnahme auf gehobenem Niveau gibt es einen Bonus auf eure Kundenzufriedenheit."

[events.nervige_authentifizierung]
narrative = "Ihr zieht die Zugriffskontrollen an, aber die Belegschaft wurde nicht vorbereitet. Die Folge sind viele Support-Tickets und Frust – intern entsteht der Eindruck, dass Security die Arbeit blockiert."

[final_events.budget_review]
narrative = "Nach Abschluss eurer Beauftragung macht der CFO den Kassensturz: Nicht nur das Sicherheitsniveau zählt, sondern auch, ob ihr das Budget im Griff hattet."
rule = "Prüft euer Restbudget."

[practice]
title = "Übung (Beispiel, zählt nicht für die Wertung)"
narrative = "Nach einem Firmware-Update fällt das zentrale Speichersystem im Büro aus. Der Dateiserver ist nicht mehr erreichbar, Projektordner und Vorlagen stehen niemandem mehr zur Verfügung. Ob der Betrieb schnell wieder läuft und wie groß der Schaden ausfällt, zeigt die folgende Rechnung anhand der Sicherheitsmaßnahmen des Beispielteams."
cia_rationale = "Hier zählt Verfügbarkeit (A) am meisten, weil ohne Dateiserver niemand an die Daten kommt. Vertraulichkeit (C) und Integrität (I) zählen gleich viel, aber weniger."
case_1 = "Die Maßnahmen reichen nicht aus, der Ausfall trifft das Unternehmen voll."
case_2 = "Der Ausfall wird vollständig abgefangen."
case_3 = "Die Auswirkungen werden teilweise gemindert."
selection_title = "Auswahl des Beispielteams"
event_result = "Wirkung des Events auf das Beispielteam"
tracking_title = "So sieht der Eintrag im Tracking-Bogen aus"
