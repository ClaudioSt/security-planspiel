review_hint = "Rückblick im Abschluss: Eure Stufe ist das Kreuz in der Schutzbedarfstabelle (Zeile des Werts, Spalte des Hauptziels). Getroffen ist ein Risiko, wenn ihr es in der Realitätscheck-Zeile eines Angriffsblatts genannt habt. Sucht dann die Stufe, in der der volle Schaden dieses Angriffs ohne Maßnahmen liegt (Schaden im ersten Fall des Angriffsblatts). Haben mehrere Angriffe das Risiko getroffen, zählt der Angriff mit dem größten vollen Schaden. Liegt diese Stufe höher als eure, habt ihr unterschätzt; liegt sie niedriger, überschätzt; ist sie gleich, lagt ihr richtig. Hat kein Angriff das Risiko getroffen, gilt es als überschätzt."
