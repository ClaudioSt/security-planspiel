text = "Die Stufen gelten ab der genannten Grenze einschließlich:"

[sheets.was_neu.rules.e_target]
heading = "E-Ziel"
text = "Kein KZ-Bonus oder -Malus mehr für das Erreichen eines E-Ziels; auf dem Papier ist nichts zu tun."

[sheets.was_neu.rules.rounding]
heading = "Rundung der KZ"
text = "KZ-Änderung je Welle: genau einmal runden (halbe Werte vom Betrag weg), danach auf die Skala begrenzen."

[sheets.was_neu.rules.final_index]
