need_instruction = "Welche Werte von MechTech findet ihr in den Story-Unterlagen, etwa Daten, Anlagen oder Know-how? Tragt jeden Wert in eine Zeile ein und kreuzt je Schutzziel an, wie groß der Schaden fürs Geschäft wäre, wenn Vertraulichkeit (C), Integrität (I) oder Verfügbarkeit (A) verletzt würde: gering, mittel oder hoch. Könnt ihr eine Folge nicht einschätzen, fragt die Geschäftsführung von MechTech (die Spielleitung)."
