[story.steckbrief]
doc_title = "MechTech GmbH: Unternehmenssteckbrief"

[story.steckbrief.kurzprofil]
heading = "Kurzprofil"
text = "Die MechTech GmbH ist ein mittelständischer Präzisionsfertiger mit Schwerpunkt auf Komponenten für E-Antriebe. Am Standort Göppingen (Baden-Württemberg) werden hochgenaue CNC-Komponenten gefertigt und Entwicklungsleistungen für Prototypen sowie Kleinserien erbracht. Der Betrieb ist auf hohe Wiederholgenauigkeit, stabile Prozessketten und termintreue Auslieferung ausgelegt."

[story.steckbrief.produkte]
heading = "Produkte & Leistungen"
bullets = [
    "Präzisions-Getriebeteile für E-Antriebe",
    "CNC-gefräste Komponenten (Toleranzen < 10 µm)",
    "Prototyping und Kleinserien für OEMs",
    "Zerspanungstechnik: 5-Achs-Fräsen und Drehen",
]

[story.steckbrief.standort_organisation]
heading = "Standort & Organisation"
bullets = [
    "Hauptsitz/Produktion: Göppingen, 1 Halle (3.500 m²)",
    "Mitarbeitende: ca. 80",
    "Produktion: 50 (Facharbeiter, Meister, Qualität)",
    "Verwaltung: 20 (Vertrieb, Einkauf, Buchhaltung)",
    "Konstruktion/Entwicklung: 8 (CAD, Prozessplanung)",
    "IT: 2 Admins (1 Vollzeit, 1 Teilzeit)",
]

[story.steckbrief.eckdaten]
heading = "Wirtschaftliche Eckdaten"
bullets = [
    "Umsatz: ca. 15 Mio. EUR p. a.",
    "Kundenstruktur: 1 deutscher Premium-OEM als Hauptkunde (ca. 60 % Umsatz)",
    "Weitere Kunden: ca. 25 (Tier-1-Zulieferer, Maschinenbau)",
    "Wachstum: ca. +12 % p. a. (getrieben durch E-Mobility-Nachfrage)",
]

[story.steckbrief.produktion_betrieb]
heading = "Produktion & Betrieb"
bullets = [
    "Betriebsmodell: 24/5 (Mo. bis Fr., 3 Schichten)",
    "Anlagenpark: 12 CNC-Maschinen, 3 Fertigungslinien",
    "Produktionssteuerung: MES Siemens Opcenter; SCADA/HMI zur Visualisierung",
    "CNC-Steuerungen u. a.: Siemens, Heidenhain",
    "Liefermodell: Just-in-Time an OEM, Liefertermintreue > 98 %",
    "Operative Prämisse: Unterbrechungen > 4 Stunden wirken sich unmittelbar auf Auslieferungen aus und können Vertragsstrafen auslösen",
]

