[story.steckbrief]
doc_title = "MECHTECH GmbH: Unternehmenssteckbrief"

[story.steckbrief.kurzprofil]
heading = "Kurzprofil"
text = "Die MECHTECH GmbH ist ein mittelständischer Präzisionsfertiger mit Schwerpunkt auf Komponenten für E-Antriebe. Am Standort Göppingen (Baden-Württemberg) werden hochgenaue CNC-Komponenten gefertigt und Entwicklungsleistungen für Prototypen sowie Kleinserien erbracht. Der Betrieb ist auf hohe Wiederholgenauigkeit, stabile Prozessketten und termintreue Auslieferung ausgelegt."

[story.steckbrief.produkte]
heading = "Produkte & Leistungen"
bullets = [
    "Präzisions-Getriebeteile für E-Antriebe",
    "CNC-gefräste Komponenten (Toleranzen < 10 µm)",
    "Prototyping und Kleinserien für OEMs",
    "Zerspanungstechnik: 5-Achs-Fräsen und Drehen",
]

[story.steckbrief.standort_organisation]
heading = "Standort & Organisation"
bullets = [
    "Hauptsitz/Produktion: Göppingen, 1 Halle (3.500 m²)",
    "Mitarbeitende: ca. 80",
    "Produktion: 50 (Facharbeiter, Meister, Qualität)",
    "Verwaltung: 20 (Vertrieb, Einkauf, Buchhaltung)",
    "Konstruktion/Entwicklung: 8 (CAD, Prozessplanung)",
    "IT: 2 Admins (1 Vollzeit, 1 Teilzeit)",
]

[story.steckbrief.eckdaten]
heading = "Wirtschaftliche Eckdaten"
bullets = [
    "Umsatz: ca. 15 Mio. EUR p. a.",
    "Kundenstruktur: 1 deutscher Premium-OEM als Hauptkunde (ca. 60 % Umsatz)",
    "Weitere Kunden: ca. 25 (Tier-1-Zulieferer, Maschinenbau)",
    "Wachstum: ca. +12 % p. a. (getrieben durch E-Mobility-Nachfrage)",
]

[story.steckbrief.produktion_betrieb]
heading = "Produktion & Betrieb"
bullets = [
    "Betriebsmodell: 24/5 (Mo. bis Fr., 3 Schichten)",
    "Anlagenpark: 12 CNC-Maschinen, 3 Fertigungslinien",
    "Produktionssteuerung: MES Siemens Opcenter; SCADA/HMI zur Visualisierung",
    "CNC-Steuerungen u. a.: Siemens, Heidenhain",
    "Liefermodell: Just-in-Time an OEM, Liefertermintreue > 98 %",
    "Operative Prämisse: Unterbrechungen > 4 Stunden wirken sich unmittelbar auf Auslieferungen aus und sind in Vertragskontexten relevant",
]

[story.steckbrief.it_ot_landschaft]
heading = "IT-/OT-Landschaft"

[story.steckbrief.it_ot_landschaft.office_engineering]
heading = "Office / Engineering"
bullets = [
    "Windows Server 2019 (Active Directory)",
    "ca. 30 Windows-PCs (Office, SharePoint, E-Mail)",
    "CAD: Siemens NX (8 Arbeitsplätze)",
    "File-Server (Konstruktionsdaten, Dokumente)",
]

[story.steckbrief.it_ot_landschaft.ot_produktion]
heading = "OT / Produktion"
bullets = [
    "MES (Siemens, Windows-Server)",
    "SCADA/HMI-Systeme",
    "12 CNC-Steuerungen (Siemens/Heidenhain)",
    "Office-IT und OT/Produktion nutzen dasselbe LAN (kein separates OT-Netz)",
]

[story.steckbrief.it_ot_landschaft.saas_cloud]
heading = "SaaS / Cloud / Externe Anwendungen"
bullets = [
    "CRM: Salesforce",
    "Cloud-Backup: Veeam für Office-Daten (monatliche Sicherung)",
    "Lieferanten-Portal: extern erreichbare Web-Applikation",
    "Cloud-Nutzung ist auf Vertriebsprozesse (Salesforce) und die monatliche Backup-Sicherung beschränkt, keine weiteren Fachanwendungen in der Cloud im Einsatz",
    "Mobilgeräte: Außendienst und Vertrieb nutzen firmeneigene Notebooks, kein separates Mobile-Device-Programm im Einsatz",
]

[story.steckbrief.betrieb_service]
heading = "Betriebs- & Service-Setup"
bullets = [
    "IT-Betrieb durch 2 Administratoren (Generalistenprofil)",
    "Administratorzugänge: gemeinsam genutzte Admin-Konten für Server- und Netzwerkkomponenten, keine gesonderte Verwaltung privilegierter Zugriffe",
    "Externe IT-Dienstleister bei Bedarf, Remote-Zugriff für Support",
    "Remote-Zugänge durch fünf Lieferanten (u. a. MES, CAD, IT)",
    "Policies/Standards: derzeit nicht als dokumentierter Satz beschrieben",
    "Sicherheitsbetrieb: SIEM/EDR nicht als feste Plattformkomponenten genannt",
    "Patch-/Update-Praxis in der Produktion: Umsetzung im Rahmen verfügbarer Wartungsfenster",
]

[story.steckbrief.abhaengigkeiten]
heading = "Abhängigkeiten"
bullets = [
    "Hohe Kopplung zwischen Liefermodell (JIT/Termintreue) und Verfügbarkeit von MES/SCADA sowie Engineering- und File-Services",
    "Relevanz von Konstruktions- und Prozessdaten für Fertigungsfähigkeit und Kundenkommunikation",
    "Mehrere Remote-Zugänge in Kombination mit schlankem IT-Team und stark integrierter Netzwerkinfrastruktur",
    "Auslastungs- und Stillstandsfenster als Taktgeber für Änderungen/Updates in der produktionsnahen Umgebung",
]

