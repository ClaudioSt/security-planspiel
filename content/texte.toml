anticipated_sum_intro = "Auf dieser Seite plant ihr euer Budget für alle Wellen. Init-Kosten fallen einmalig an, wenn ihr eine Maßnahme einführt oder ihr Level erhöht. OPEX fallen in jeder Welle an, in der die Maßnahme aktiv ist."

