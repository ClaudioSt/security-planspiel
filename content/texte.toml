    "Angesichts steigender Cyberbedrohungen (insb. Datenverlust, Supply-Chain-Angriffe) stellen wir sicher, dass unsere Lieferkette angemessen abgesichert ist.",
]

[story.audit_mail.nachweise]
heading = "ERWARTETE NACHWEISE:"
text = "Im Audit werden wir vor allem folgende Punkte prüfen:"
bullets = [
    "IAM/ PAM",
