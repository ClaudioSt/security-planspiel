# Szenen der Vor-Ort-Analyse (Adventure, Variante A). Objekte und Antworten tragen keinen eigenen Hinweistext:
# quelle + index zeigen auf einen Satz der Story-Unterlagen (texte.toml), der sich anheften lässt. So bleibt
# clues.toml die einzige Hinweisliste und der Druck unberührt. Neutrale Objekte haben keine Quelle.
[web.szenen.serverraum]
name = "Serverraum"
intro = "Ein schmaler Raum im Erdgeschoss, warm und laut. Hier laufen die Server von MechTech, daneben stapeln sich Kartons."
figur = "it"

[web.szenen.serverraum.objekte.monitor]
name = "Admin-Arbeitsplatz"
ansehen = "Auf dem Monitor klebt ein Zettel. Darunter liegt eine Übersicht der Zugänge."
quelle = "story.steckbrief.betrieb_service.bullets"
index = 1

[web.szenen.serverraum.objekte.backup]
name = "Backup-Regal"
ansehen = "Ein Regal mit beschrifteten Ordnern. Auf dem obersten klebt ein Etikett zur Datensicherung."
quelle = "story.steckbrief.it_ot_landschaft.saas_cloud.bullets"
index = 1

[web.szenen.serverraum.objekte.netzwerkschrank]
name = "Netzwerkschrank"
ansehen = "Ein einziger Switch, alle Kabel laufen hier zusammen. Ein Netzplan hängt an der Tür."
quelle = "story.steckbrief.it_ot_landschaft.ot_produktion.bullets"
index = 3

