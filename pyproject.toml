[project]
name = "security-planspiel"
version = "0.1.0"
description = "Shared rules and tooling for the CIA-Planspiel simulation."
requires-python = ">=3.12"
dependencies = [
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
]

[project.scripts]
planspiel = "planspiel.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "planspiel"

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow' --strict-markers"
markers = ["slow: full-enumeration checks over all 782,336 dependency-valid combinations per tier; run with `uv run pytest -m slow`"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
