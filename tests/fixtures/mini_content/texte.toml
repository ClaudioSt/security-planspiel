[sheets.angriff]
start_values_intro = "Euer Unternehmen startet je Schutzziel mit einem Basiswert. Eure gewählten Maßnahmen erhöhen diese Werte."
cia_table_instruction = "Tragt die CIA-Werte eurer Maßnahmen ein und berechnet euren Gesamtschutz über alle Schutzziele."
e_value_intro = "Als Nächstes berechnet ihr den Effektivitätswert (E-Wert). Er zeigt, wie gut ihr gegen diesen Angriffstyp geschützt seid:"
bonus_intro = "Zusätzlich bekommt ihr einen Bonus, wenn ihr passende Maßnahmen für diesen Angriff mindestens auf dem richtigen Level habt. Der Bonus wird zur Gesamtreduktion addiert."
case_3_hint = "Berechnet Schaden und KZ:"

[sheets.budget]
title = "Budget"
intro = "Das Budget ist das Geld, das euch Beratern für die Umsetzung von Maßnahmen zur Verfügung steht. Mit dem Budget müsst ihr Maßnahmen initiieren und betreiben."
init_what = "Einmalige Anschaffungskosten für eine Maßnahme (Hardware, Software, Einrichtung)"
init_when = "Einmal zu Spielbeginn"
opex_what = "Laufende Betriebskosten (Lizenzen, Personal, Wartung)"
opex_when = "Jede Welle erneut"
tier_intro = "Im Planspiel wählt ihr zu Beginn ein Budget-Tier. Je höher euer Budget, desto mehr bzw. stärkere Maßnahmen könnt ihr umsetzen. Gleichzeitig sind die Erwartungen höher, was sich in einem entsprechend angepassten Startwert der Kundenzufriedenheit (KZ) widerspiegelt. Legt daher zuerst euer Budget-Tier fest, bevor ihr eure Maßnahmen auswählt."
anticipated_sum_intro = "In diesem Sheet plant und trackt ihr euer Budget über alle Wellen. Init-Kosten fallen nur einmalig an, wenn ihr eine Maßnahme einführt oder auf ein höheres Level upgraded. OPEX-Kosten fallen dagegen in jeder Welle an, in der die Maßnahme aktiv ist."
status_tracker_intro = "Trackt hier nach jeder Welle euren aktuellen Stand: verbleibendes Budget, die aktuellen CIA-Werte (Summe aus Basisschutz + Maßnahmen, siehe jeweilige Angriffskarte) und die kumulierte Kundenzufriedenheit. So habt ihr den Überblick, ohne in den Angriffskarten zurückblättern zu müssen."

[sheets.ros]
title = "Return on Security"
instruction = "Trag die folgenden Werte ein:"
purpose = "Der RoS zeigt, ob sich eure Security-Investition finanziell gelohnt hat."

[sheets.backup_recovery]
title = "Backup & Recovery"
subtitle = "Event: Nach jeder Welle mit Recovery-Option"
narrative = "Nach einem Angriff mit entstandenem Schaden prüft ihr, ob Systeme wiederhergestellt werden müssen oder ob der Betrieb stabil geblieben ist. Falls überhaupt ein Schaden entstanden ist, entscheidet eure Backup- und Recovery-Fähigkeit darüber, wie stark ihr den finanziellen Impact senken könnt."

[sheets.backup_recovery.level_labels]
0 = "kein Recovery"
1 = "Basis-Recovery"
2 = "teilw. Recovery"
3 = "starke Recovery"

