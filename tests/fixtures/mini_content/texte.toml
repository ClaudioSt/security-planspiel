[events.kurswechsel]
narrative = "Nach den neuesten Erkenntnissen entscheidet die Geschäftsführung: Eure Sicherheitsstrategie wird neu ausgerichtet."
rule = """Die Geschäftsführung richtet die Sicherheitsstrategie neu aus. Im Change-Fenster nach dieser Welle führt jedes Team genau einen Maßnahmentausch durch: Eine in dieser Welle aktive Maßnahme fällt ganz weg, eine in dieser Welle nicht aktive Maßnahme kommt auf einem frei wählbaren Level hinzu. Der Kunde übernimmt die Init-Kosten der neuen Maßnahme bis zur Höhe der Init-Kosten der wegfallenden Maßnahme auf ihrem Level in dieser Welle; nur einen Mehrbetrag zahlt das Team, eine günstigere neue Maßnahme bringt keine Erstattung. Abhängige Maßnahmen der wegfallenden Maßnahme senkt das Team im selben Fenster passend ab. Ist in dieser Welle keine oder jede Maßnahme aktiv, entfällt der Tausch. Normale Levelwechsel im selben Change-Fenster bleiben erlaubt."""

[events.operative_unterstuetzung]
narrative = "Ihr bekommt operative Unterstützung: Ein zentraler Rahmenvertrag senkt kurzfristig die laufenden Betriebskosten."
rule = "Zählt für jede Maßnahme, die in dieser Welle aktiv ist."

[events.sparprogramm]
narrative = "Der CFO verkündet ein konzernweites Sparprogramm. Das Budget wird gekürzt."
rule = "Geprüft wird das Restbudget erst am Ende; im Change-Fenster nach dieser Welle könnt ihr noch gegensteuern (Herabstufen oder Kündigen spart OPEX der folgenden Wellen, Init wird nicht erstattet)."

[events.oem_audit]
narrative = "Der große Automobilkunde prüft die Sicherheitsstandards."
checklist_heading = "Audit Checkliste"

[events.kritische_schwachstelle]
